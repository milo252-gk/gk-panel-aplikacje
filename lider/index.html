<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<!-- Bez maximum-scale: lider w rękawicach i w słabym świetle musi móc powiększyć ekran palcami. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4E4E4E">
<!-- Motyw przed arkuszami — inaczej wybrany ciemny motyw mignie bielą przy każdym otwarciu. -->
<script src="../wspolne/motyw.js"></script>
<title>GK Produkcja</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikona.svg" type="image/svg+xml">
<!-- iPhone: ikona PNG (SVG nie bierze), pełny ekran z ekranu początkowego, krótka nazwa pod ikoną.
     Pasek stanu czarny, nie przezroczysty: przy „black-translucent” strona wchodzi pod wycięcie
     ekranu, a pasek połączenia, okna i skaner nie mają tam odstępu. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Produkcja">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="../wspolne/hala.css">
<link rel="stylesheet" href="lider.css">
</head>
<body>
<button id="pasek" class="hala-polaczenie ok" type="button" aria-live="polite"></button>

<!-- ====================================================== LOGOWANIE -->
<!-- Standard GK (D22) i identyfikator + hasło (D24; od 2026-11-26 bez PIN-u i bez klawiatury cyfr). Czytnik kart „pisze”
     w pole identyfikatora i kończy Enterem — Enter przenosi wtedy do pola hasła. -->
<main id="logowanie" class="hala-logowanie" hidden>
  <div class="hala-karta-logowania">
    <img src="../wspolne/logo-gkf.png" alt="GK Factory" class="hala-logo">
    <h1>GK Produkcja</h1>
    <p class="pod">Zaloguj się imieniem i nazwiskiem i&nbsp;hasłem</p>
    <form id="formularz-logowania" autocomplete="off">
      <label>Imię i nazwisko (albo karta)
        <span class="rzad">
          <input id="identyfikator" name="identyfikator" autocapitalize="off" spellcheck="false" placeholder="np. Jan Kowalski">
          <button id="skanuj-karte" type="button" aria-label="Skanuj identyfikator" title="Skanuj identyfikator"><span class="ik" data-ikona="aparat" data-rozmiar="22"></span></button>
        </span>
      </label>
      <label><span id="pin-etykieta">Hasło</span>
        <input id="pin" name="pin" type="password" autocomplete="current-password">
      </label>
      <button class="glowny" type="submit" id="zaloguj-haslem">Zaloguj</button>
    </form>
    <p id="blad-logowania" class="blad" role="alert" hidden></p>
    <p class="hala-konto-skad">Konto zakłada Menedżer w Panelu Zarządczym GK → Administracja albo Kierownik zakładu (GK Produkcja → Moje konto → Mój zespół).</p>
    <p id="czeka-na" class="pod czeka-na" hidden></p>
  </div>
</main>

<!-- ====================================================== APLIKACJA -->
<div id="aplikacja" class="aplikacja hala-uklad" hidden>
  <header class="naglowek">
    <!-- H26/H27 (właściciel 2026-11-27): kontekst po lewej — linia (wybór), pod nią zmiana i godziny w JEDNYM wierszu; Magazyn bez linii: sama zmiana, jak w UR i KJ. -->
    <div class="naglowek-kontekst">
      <button id="wybor-linii" class="linia" type="button" aria-label="Zmień linię"></button>
      <div id="opis-zmiany" class="opis-zmiany"></div>
    </div>
    <div class="kto"><button id="menu" class="hala-konto-przycisk" type="button" aria-label="Moje konto" title="Moje konto"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" fill="currentColor"/></svg></button></div>
  </header>

  <div id="wezwania" class="wezwania" aria-live="assertive"></div>

  <main class="ekrany">
    <section id="ekran-zmiana" class="ekran" aria-label="Moja zmiana"></section>
    <section id="ekran-awarie" class="ekran" aria-label="Awaria" hidden></section>
    <section id="ekran-jakosc" class="ekran" aria-label="Jakość" hidden></section>
    <section id="ekran-koniec" class="ekran" aria-label="Koniec zmiany" hidden></section>
    <section id="ekran-wiecej" class="ekran" aria-label="Więcej" hidden></section>
    <section id="ekran-rcp" class="ekran" aria-label="RCP — ludzie ze zmiany" hidden></section>
    <section id="ekran-moje" class="ekran" aria-label="Moje zgłoszenia" hidden></section>
    <section id="ekran-wyniki" class="ekran" aria-label="Moje wyniki" hidden></section>
    <section id="ekran-zlecenia" class="ekran" aria-label="Zlecenia od kierownika" hidden></section>
  </main>

  <!-- Menu jak w GK Trasy/GK Flota: po lewej na komputerze i tablecie (hala.css → .hala-menu), dolny pasek na telefonie. -->
  <nav class="dolny hala-menu" aria-label="Ekrany">
    <div class="hala-menu-naglowek">
      <img src="../wspolne/logo-gkf.png" alt="GK Factory" class="hala-menu-logo">
      <div class="hala-menu-nazwa" id="menu-kto"></div>
      <div class="hala-menu-rola" id="menu-rola"></div>
      <div class="hala-menu-kto">GK Produkcja</div>
    </div>
    <button type="button" data-ekran="zmiana" aria-current="page"><span class="ikona" data-ikona="zmiana" aria-hidden="true"></span>Moja zmiana</button>
    <button type="button" data-ekran="jakosc"><span class="ikona" data-ikona="proba" aria-hidden="true"></span>Jakość<span class="plakietka" data-plakietka="jakosc" hidden></span></button>
    <!-- Ikona awaria = awarie (zgłoszenie i lista) w GK Produkcja i GK Utrzymanie Ruchu; ikona przeglady to w UR przeglądy — jedna ikona, jedna rzecz.
         UI etap 2: jedna czerwona zakładka zamiast przycisku AWARIA i zakładki „Awarie” — zgłoszenie na górze, pod nim lista. -->
    <button type="button" data-ekran="awarie" class="awaria"><span class="ikona" data-ikona="awaria" aria-hidden="true"></span>Awarie<span class="plakietka" data-plakietka="awarie" hidden></span></button>
    <button type="button" data-ekran="zlecenia"><span class="ikona" data-ikona="zlecenia" aria-hidden="true"></span>Zlecenia<span class="plakietka" data-plakietka="zlecenia" hidden></span></button>
    <!-- D74 (właściciel 2026-10-16): menu kończy się „Zlecenia” i „Więcej”, jak w UR i KJ (D64) — „Koniec zmiany” jest w Więcej. -->
    <button type="button" data-ekran="wiecej"><span class="ikona" data-ikona="wiecej" aria-hidden="true"></span>Więcej<span class="plakietka" data-plakietka="wiecej" hidden></span></button>
    <div class="hala-menu-stopka"><button type="button" id="menu-wyloguj"><span class="ikona" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span><span>Wyloguj</span></button></div>
  </nav>
</div>

<!-- Ekran blokujący alertu jakości — nad wszystkim oprócz okna awarii i skanera. -->
<div id="blokada" class="blokada" role="alertdialog" aria-modal="true" aria-labelledby="blokada-tytul" hidden></div>

<!-- Jedno okno na formularze (próba, obsada, BHP, awaria…). -->
<div id="okno" class="okno" role="dialog" aria-modal="true" aria-labelledby="okno-tytul" hidden>
  <div class="okno-karta">
    <header><h2 id="okno-tytul"></h2><button id="okno-zamknij" type="button" class="zamknij" aria-label="Zamknij"><span data-ikona="zamknij" data-rozmiar="20"></span></button></header>
    <div id="okno-tresc" class="okno-tresc"></div>
  </div>
</div>

<!-- popover="manual": Lider.komunikat wnosi dymki nad okna <dialog> (Moje konto, Mój zespół) — jak UR i KJ (hala.css). -->
<div id="komunikaty" class="komunikaty" popover="manual" role="status" aria-live="polite"></div>

<script src="../wspolne/hala.js"></script>
<script src="../wspolne/aktualizacja.js"></script>
<script src="../wspolne/konto.js"></script>
<script src="../wspolne/zespol.js"></script>
<script src="../wspolne/gk-ikony.js"></script>
<script src="../wspolne/gk-dzwieki.js"></script>
<script src="../wspolne/reakcje.js"></script>
<script src="../wspolne/okna-x.js"></script>
<script src="../wspolne/kolejka-ui.js"></script>
<script src="../wspolne/palec.js"></script>
<script src="../wspolne/miary.js"></script>
<script src="../wspolne/wyniki.js"></script>
<script src="../wspolne/dzialania.js"></script>
<script src="../wspolne/naglowek.js"></script>
<script src="../wspolne/zlecenia.js"></script>
<script src="../wspolne/skaner.js"></script>
<script src="widok.js"></script>
<script src="app.js"></script>
<script src="awarie.js"></script>
<script src="jakosc.js"></script>
<script src="zmiana.js"></script>
<script src="rcp.js"></script>
<script src="formularze.js"></script>
</body>
</html>
