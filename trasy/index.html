<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<!-- Bez maximum-scale: kierowca w słońcu musi móc rozsunąć ekran palcami.
     Pole podpisu i mapa mają własną obsługę dotyku, więc im to nie przeszkadza. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E4E4E">
<script>
/* Motyw rozstrzygamy PRZED arkuszem. Inaczej pierwszy obraz jest zawsze jasny,
   a kierowca otwierający aplikację w nocy dostaje w oczy białą kartkę.

   Bez osobnego pliku, i to nie z lenistwa: index.html serwer oddaje
   z „no-store”, więc ten kawałek NIGDY nie bywa starą kopią. Osobny motyw.js
   trzeba by dopisywać w trzech ręcznych listach (tu, ZASOBY w sw.js, PLIKI
   w smoke.js), a pominięcie tej w sw.js oznacza program, który nie wstaje
   bez zasięgu. W head byłby do tego kolejnym blokującym pobraniem.

   Ta sama reguła co Motyw.policz w app.js. Dwie kopie jednej reguły to dług —
   spina je test w smoke.js, który wykonuje ten kod i porównuje z app.js.

   Dwa osobne try/catch, bo w Safari w trybie prywatnym sam DOSTĘP do
   localStorage potrafi rzucić wyjątkiem, a wyjątek w skrypcie w head zatrzymuje
   parsowanie strony — telefon pokazałby wtedy biały ekran zamiast logowania.

   Najpierw klucz WSPÓLNY programów GK („gk.motyw” — ten sam w Panelu
   i GK Flota; na GitHub Pages wszystkie aplikacje GK dzielą jeden
   localStorage). Potem dawne klucze tylko jako migracja (app.js przenosi je
   do wspólnego): własny z przedrostkiem „gk-trasy.”, a bez przedrostka tylko
   poza Pages — tam jest cudzy. */
(function () {
  var wybor = null;
  try {
    wybor = localStorage.getItem('gk.motyw');
    // Obca wartość (np. 'auto') znaczy to samo co brak klucza.
    if (wybor !== 'jasny' && wybor !== 'ciemny') wybor = localStorage.getItem('gk-trasy.motyw');
    if (wybor === null && !/(^|\.)github\.io$/i.test(String(location.hostname || ''))) {
      wybor = localStorage.getItem('motyw');
    }
  } catch (e) { /* tryb prywatny */ }
  var systemCiemny = false;
  try {
    systemCiemny = !!(window.matchMedia
      && window.matchMedia('(prefers-color-scheme: dark)').matches);
  } catch (e) { /* starsza przeglądarka */ }
  var motyw = (wybor === 'ciemny' || (wybor !== 'jasny' && systemCiemny)) ? 'ciemny' : 'jasny';
  var korzen = document.documentElement;
  korzen.setAttribute('data-motyw', motyw);
  /* Styl wpisany wprost działa od razu; ta sama deklaracja z arkusza dopiero
     po jego wczytaniu. Po wolnym łączu to widoczna różnica: pola dat, listy
     rozwijane i autouzupełnianie zdążyłyby mrugnąć bielą. */
  korzen.style.colorScheme = motyw === 'ciemny' ? 'dark' : 'light';
  var pasek = document.querySelector('meta[name=theme-color]');
  if (pasek) pasek.setAttribute('content', motyw === 'ciemny' ? '#191817' : '#4E4E4E');
})();
</script>
<title>Panel Zarządczy SP</title>

<link rel="icon" href="ikona.svg?v=trasex-e43a8c0e5335">

<link rel="apple-touch-icon" href="apple-touch-icon.png?v=trasex-e43a8c0e5335">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel SP">
<!-- Ciemny pasek z bialym tekstem — jak naglowek aplikacji (theme-color). -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="stylesheet" href="style.css?v=trasex-e43a8c0e5335">

<body>

<!-- ===================================================== EKRAN LOGOWANIA -->
<div id="ekran-logowania" class="logowanie ukryty">
  <form class="karta-logowania" id="form-logowania">
    <img class="znak-logo" src="logo-gkf.png?v=trasex-e43a8c0e5335"
         alt="GK Factory" width="666" height="374">
    <h1>Panel Zarządczy SP</h1>
    <p class="pod">Zaloguj się imieniem i&nbsp;nazwiskiem i&nbsp;<span class="bez-lamania">hasłem</span></p>
    <!-- Stare loginy (np. „marek”) dalej dzialaja — serwer je zna (GK-KONTA.md, punkt 4). -->
    <label>Imię i nazwisko
      <input name="login" id="pole-loginu" autocomplete="username" autocapitalize="none"
             autocorrect="off" spellcheck="false" required placeholder="np. Jan Kowalski">
    </label>
    <!-- Logowanie bez PIN-ow (wlasciciel 2026-11-26): drugie pole to zawsze „Hasło” z pelna klawiatura
         (app.js → poleSekretu). Nazwa pola „pin” zostaje — tak nazywa sie sekret w API logowania. -->
    <label><span id="etykieta-sekretu">Hasło</span>
      <input name="pin" id="pole-sekretu" type="password" autocomplete="current-password" maxlength="128" required>
    </label>
    <button class="glowny duzy" type="submit">Zaloguj</button>
    <div class="blad-logowania" id="blad-logowania" role="alert"></div>
    <!-- Tylko gdy konta przychodza z Panelu (GET /api/zyje → konta_z_panelu). -->
    <p class="info-kont" id="info-kont" hidden>Konto zakłada Menedżer w Panelu Zarządczym GK
      → Administracja.</p>
  </form>
</div>

<!-- ============================================================ APLIKACJA -->
<div id="aplikacja" class="ukryty">

  <header class="gora">
    <div class="tytul" id="tytul-ekranu">Pulpit</div>
    <!-- Jedno pole „Szukaj” (ocena UX 2026-11-17, D4): klient, numer dokumentu, kierowca, trasa, dostawa. Na komputerze stale
         widoczne, na telefonie rozwija je lupa. Biuro i konto podglądu (menuDlaRoli). -->
    <form class="gora-szukaj tylko-biuro" id="gora-szukaj" role="search" autocomplete="off">
      <input type="search" id="gora-szukaj-pole" maxlength="80" placeholder="Szukaj: klient, dokument, kierowca, trasa"
             aria-label="Szukaj w planie: klient, numer dokumentu, kierowca, trasa, dostawa" enterkeyhint="search">
      <div class="gora-szukaj-wyniki" id="gora-szukaj-wyniki" hidden></div>
    </form>
    <div class="gora-prawo">
      <span class="etykieta-podgladu" title="To konto tylko ogląda plan tras — planowanie robi biuro">Tylko podgląd</span>
      <button class="ikona-btn stan-sieci-btn" id="stan-sieci-btn" aria-label="Stan połączenia">
        <span class="stan-sieci" id="stan-sieci"></span></button>
      <button class="ikona-btn tylko-biuro" id="btn-szukaj" aria-label="Szukaj" aria-expanded="false"><span data-ikona="szukaj" data-rozmiar="22"></span></button>
      <!-- Ikona osoby w SVG, nie emoji 👤: Windows rysuje emoji na fioletowo i ginie ono
           na grafitowym pasku. currentColor = biel paska (STYL-GK §3). -->
      <button class="ikona-btn" id="btn-konto" aria-label="Moje konto" title="Moje konto"><svg
        viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="8" r="4"
        fill="currentColor"/><path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" fill="currentColor"/></svg></button>
    </div>
  </header>
  <!-- D65: pasek połączenia z tekstem, jak w aplikacjach hali (app.js → odswiezPasekPolaczenia). -->
  <button type="button" class="pasek-polaczenia ok" id="pasek-polaczenia" hidden></button>

  <nav class="menu" id="menu">
    <div class="menu-naglowek">
      <img class="menu-logo" src="logo-gkf.png?v=trasex-e43a8c0e5335" alt="GK Factory"
           width="666" height="374">
      <div class="menu-imie" id="menu-imie"></div>
      <!-- 2026-11-23: trzy linie jak w aplikacjach hali — imię i nazwisko, NAZWA ROLI osoby (app.js → wejdzDoAplikacji), STAŁA nazwa programu. -->
      <div class="menu-rola menu-rola-osoby" id="menu-rola"></div>
      <div class="menu-rola">Panel Zarządczy SP</div>
    </div>
    <!-- Kierowca: najpierw „Moja trasa” (ekran startowy) i „Załadunek”, jak dolny pasek;
         „Historia tras” dalej (2026-10-16). Biuro (E6, 2026-11-24): Pulpit, Trasy (z przełącznikiem widoków: Dzień · Tydzień · Lista · Zapisane trasy · Kalendarz), Zaległe, Klienci, Wskaźniki, Raporty, RCP, Administracja/Ustawienia. -->
    <button data-ekran="pulpit"   class="tylko-biuro"><span class="ikona-menu" data-ikona="pulpit"></span> <span>Pulpit</span></button>
    <button data-ekran="moja"     class="tylko-kierowca"><span class="ikona-menu" data-ikona="ciezarowka"></span> <span>Moja trasa</span></button>
    <button data-ekran="zaladunek" class="tylko-kierowca"><span class="ikona-menu" data-ikona="paczka"></span> <span>Załadunek</span></button>
    <button data-ekran="trasy"><span class="ikona-menu" data-ikona="mapa"></span>
      <span class="tylko-biuro">Trasy</span><span class="tylko-kierowca">Historia tras</span></button>
    <button data-ekran="zalegle"  class="tylko-biuro"><span class="ikona-menu" data-ikona="klepsydra"></span> <span>Zaległe dostawy</span></button>
    <button data-ekran="klienci"><span class="ikona-menu" data-ikona="firma"></span> <span>Klienci</span></button>
    <button data-ekran="wskazniki" class="tylko-biuro"><span class="ikona-menu" data-ikona="wskazniki"></span> <span>Wskaźniki</span></button>
    <button data-ekran="raporty"><span class="ikona-menu" data-ikona="raporty"></span> <span class="tylko-biuro">Raporty</span><span class="tylko-kierowca">Raport pracy</span></button>
    <button data-ekran="rcp" class="tylko-administrator"><span class="ikona-menu" data-ikona="zegar"></span> <span>RCP</span></button>
    <!-- Widoczne tylko u kierowcy i tylko przy połączeniu z GK Flota (menuDlaRoli). -->
    <button data-ekran="mojeauto" id="btn-moje-auto" class="ukryty"><span class="ikona-menu" data-ikona="pojazd"></span> <span>Moje auto</span></button>
    <!-- Administrator: jedna pozycja „Administracja” (Pracownicy · Kody QR · Ustawienia), STYL-GK §8; Czyszczenie tras — przycisk na ekranie Trasy.
         Biuro zachowuje swoje „Ustawienia firmy” (menuDlaRoli: tylko-ustawienia-firmy). -->
    <button data-ekran="administracja" class="tylko-administrator"><span class="ikona-menu" data-ikona="administracja"></span> <span>Administracja</span></button>
    <button data-ekran="ustawienia" class="tylko-ustawienia-firmy"><span class="ikona-menu" data-ikona="administracja"></span> <span>Ustawienia</span></button>
    <button id="btn-menu-konto" class="tylko-podglad"><span class="ikona-menu" data-ikona="osoba"></span> <span>Moje konto</span></button>
    <button id="btn-menu-instrukcja" class="tylko-podglad"><span class="ikona-menu" data-ikona="dokument"></span> <span>Instrukcja</span></button>
    <div class="menu-stopka">
      <!-- Ikona „wyjście” w SVG, ta sama co #menu-wyloguj w aplikacjach hali
           (STYL-GK §3): currentColor = biel menu, nie brązowe emoji drzwi. -->
      <button id="btn-wyloguj"><span class="ikona-menu" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span> <span>Wyloguj</span></button>
    </div>
  </nav>
  <div class="zaslona" id="zaslona"></div>

  <main id="tresc"></main>

  <nav class="pasek-dolny tylko-telefon" id="pasek-dolny"></nav>
</div>

<!-- ============================================================== OKIENKA -->
<div class="okno-tlo ukryty" id="okno-tlo">
  <div class="okno" id="okno">
    <div class="okno-gora">
      <div class="okno-tytul" id="okno-tytul"></div>
      <button class="ikona-btn" id="okno-zamknij" aria-label="Zamknij"><span class="ik" data-ikona="zamknij" data-rozmiar="16"></span></button>
    </div>
    <div class="okno-tresc" id="okno-tresc"></div>
    <div class="okno-stopka" id="okno-stopka"></div>
  </div>
</div>

<!-- Pytanie "na pewno?" ma WŁASNĄ warstwę nad oknem. Wcześniej korzystało
     z tego samego okna co formularze, więc zadanie pytania kasowało formularz,
     w którym padło — kierowca kasujący jedno zdjęcie tracił podpis i resztę. -->
<div class="okno-tlo pytanie-tlo ukryty" id="pytanie-tlo">
  <div class="okno pytanie">
    <div class="okno-gora"><div class="okno-tytul" id="pytanie-tytul"></div></div>
    <div class="okno-tresc" id="pytanie-tresc"></div>
    <div class="okno-stopka" id="pytanie-stopka"></div>
  </div>
</div>

<!-- Dymki „Zapisano” / błędy czyta też czytnik ekranu (role=status, aria-live) — recenzja środowiska 2026-11-25, C4. -->
<div id="komunikaty" class="komunikaty" role="status" aria-live="polite"></div>
